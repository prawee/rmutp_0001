services:
  db:
    image: postgres:latest
    container_name: my_db_compose
    ports:
      - "55432:5432"
    environment:
      - POSTGRES_DB=prawee
      - POSTGRES_USER=prawee
      - POSTGRES_PASSWORD=prawee
  app:
    image: prawee/strapi
    container_name: my_app_compose
    ports:
      - "8090:1337"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=prawee
      - DATABASE_USERNAME=prawee
      - DATABASE_PASSWORD=prawee
